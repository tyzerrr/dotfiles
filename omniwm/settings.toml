# OmniWM settings
#
# This file is the canonical OmniWM configuration at ~/.config/omniwm/settings.toml.
# The workspace and app-rule entries below preserve the former AeroSpace layout:
#   1-7 -> main display, 8-9 -> secondary display
#
# Dwindle is used as the closest equivalent to AeroSpace's `tiles` layout.

[general]
hotkeysEnabled = true
defaultLayoutType = "dwindle"
ipcEnabled = true

[mouseWarp]
enabled = true

[gaps]
size = 10

[gaps.outer]
left = 10
right = 10
top = 10
bottom = 10

[borders]
enabled = true
width = 3.0

# Hyprland-style cyan focus border: #89DCEB, expressed as 0.0-1.0 RGBA.
[borders.color]
red = 0.5372549
green = 0.8627451
blue = 0.9215686
alpha = 1.0

[workspaceBar]
enabled = false
showLabels = true
showFloatingWindows = false
hideEmptyWorkspaces = false
reserveLayoutSpace = false

# AeroSpace: alt-h/j/k/l = focus left/down/up/right
[[hotkeys]]
id = "focus.left"
binding = "Option+H"

[[hotkeys]]
id = "focus.down"
binding = "Option+J"

[[hotkeys]]
id = "focus.up"
binding = "Option+K"

[[hotkeys]]
id = "focus.right"
binding = "Option+L"

# AeroSpace: alt-shift-h/j/k/l = move left/down/up/right
[[hotkeys]]
id = "move.left"
binding = "Option+Shift+H"

[[hotkeys]]
id = "move.down"
binding = "Option+Shift+J"

[[hotkeys]]
id = "move.up"
binding = "Option+Shift+K"

[[hotkeys]]
id = "move.right"
binding = "Option+Shift+L"

# Swap the complete Dwindle tile/container with its left or right neighbor.
# This is separate from move.left/right, which joins or extracts a window.
[[hotkeys]]
id = "moveColumn.left"
binding = "Control+Option+Shift+H"

[[hotkeys]]
id = "moveColumn.right"
binding = "Control+Option+Shift+L"

# AeroSpace: alt-shift-f = fullscreen
[[hotkeys]]
id = "toggleFullscreen"
binding = "Option+Shift+F"

# AeroSpace: alt-minus/equal = resize smart -/+50
[[hotkeys]]
id = "resizeFocusedWindow.shrink"
binding = "Option+Minus"

[[hotkeys]]
id = "resizeFocusedWindow.grow"
binding = "Option+Equal"

# Directional keyboard resize. H/J/K/L follows the focus key layout.
[[hotkeys]]
id = "resizeGrow.left"
binding = "Control+Option+H"

[[hotkeys]]
id = "resizeGrow.down"
binding = "Control+Option+J"

[[hotkeys]]
id = "resizeGrow.up"
binding = "Control+Option+K"

[[hotkeys]]
id = "resizeGrow.right"
binding = "Control+Option+L"

# Keep Option+Tab dedicated to workspace back-and-forth instead of OmniWM's
# default focus-previous action.
[[hotkeys]]
id = "focusPrevious"
binding = "Unassigned"

# AeroSpace: alt-tab = workspace back and forth
[[hotkeys]]
id = "workspaceBackAndForth"
binding = "Option+Tab"

# AeroSpace: alt-shift-tab moved the workspace to the next monitor.
# OmniWM uses a routed direction; this assumes the secondary monitor is to the right.
[[hotkeys]]
id = "moveWorkspaceToMonitor.right"
binding = "Option+Shift+Tab"

